name: ✨ 功能建议
description: 提出一个新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      placeholder: 我在……的场景下，希望能……
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你期望的方案
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 涉及范围
      options: [界面/交互, 数据展示, 登录, 新页面, 其他]
    validations:
      required: true
  - type: checkboxes
    id: ack
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue，确认不是重复
          required: true
