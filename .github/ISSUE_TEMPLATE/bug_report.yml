name: 🐛 Bug 反馈
description: 报告一个可复现的问题
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填全下面的信息，尤其**手表型号**与**复现步骤**。
  - type: input
    id: device
    attributes:
      label: 手表型号
      placeholder: 例：OWW211 / Galaxy Watch 5 / TicWatch Pro 5
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: 系统版本
      placeholder: 例：Android 11 (API 30) / Wear OS 4
    validations:
      required: true
  - type: dropdown
    id: webview
    attributes:
      label: 是否支持 WebView
      description: 若不确定，可在「设置 → 应用」里看有没有「Android System WebView」
      options:
        - 有 WebView（用网页登录）
        - 没有 WebView（用 Cookie 登录）
        - 不确定
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题出现在哪
      options: [登录, 成绩, 考试, 作业, 私信, 关于/设置, 界面显示, 其他]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 App
        2. 点「登录」
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志（可选）
      description: 若会使用 adb，可附上 `adb logcat -d | grep zhixue` 的输出
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: ack
    attributes:
      label: 确认
      options:
        - label: 我已搜索过现有 Issue，确认不是重复
          required: true
        - label: 我已移除日志/截图中的任何账号、Cookie 等个人信息
          required: true
